version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      # One pull request per ecosystem rather than fifteen: minor and patch
      # bumps are reviewed together or not at all.
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'build'
      include: scope

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
